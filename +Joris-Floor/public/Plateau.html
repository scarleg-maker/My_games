<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Plateau</title>
    <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,.5);
      margin-bottom: 20px;
      text-align: center;
    }

    .menu-buttons {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
    }

    #start-btn, #load-btn {
      padding: 15px 30px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
      transition: transform .2s ease, background .3s ease;
    }

    #start-btn {
      background: #2ecc71;
    }
    #start-btn:hover { background:#27ae60; transform: scale(1.05); }

    #load-btn {
      background: #e67e22;
    }
    #load-btn:hover { background:#d35400; transform: scale(1.05); }

    /* Fenêtre choix et saisie mot de passe */
    #settings, #import-panel {
      display: none;
      flex-direction: column;
      gap: 18px;
      background: linear-gradient(145deg, #ffffff, #f8f9fa);
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,.25), 0 5px 15px rgba(0,0,0,.1);
      font-family: Arial, sans-serif;
      font-size: 16px;
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      min-width: 320px;
    }

    #settings-title {
      color: #2c3e50;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin: 0 0 10px 0;
      text-shadow: 0 1px 2px rgba(0,0,0,.1);
    }

    #settings label, #import-panel label { 
      display: flex; 
      gap: 12px; 
      align-items: center;
      color: #34495e;
      font-weight: 500;
    }

    #settings select, #import-panel input { 
      padding: 10px 12px; 
      font-size: 16px;
      border: 2px solid #e0e6ed;
      border-radius: 8px;
      background: white;
      transition: all 0.3s ease;
      min-width: 120px;
    }

    #settings select:focus, #import-panel input:focus {
      border-color: #3498db;
      outline: none;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    .settings-buttons, #import-panel div {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 10px;
    }

    #settings button, #import-panel button { 
      padding: 12px 24px; 
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 100px;
    }

    #valider {
      background: linear-gradient(145deg, #27ae60, #2ecc71);
      color: white;
      box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
    }

    #valider:hover {
      background: linear-gradient(145deg, #229954, #27ae60);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
    }

    #annuler-settings, #annuler {
      background: linear-gradient(145deg, #95a5a6, #bdc3c7);
      color: white;
      box-shadow: 0 4px 15px rgba(149, 165, 166, 0.3);
    }

    #annuler-settings:hover, #annuler:hover {
      background: linear-gradient(145deg, #7f8c8d, #95a5a6);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(149, 165, 166, 0.4);
    }

    #importer-btn {
      background: linear-gradient(145deg, #e67e22, #f39c12);
      color: white;
      box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
    }

    #importer-btn:hover {
      background: linear-gradient(145deg, #d35400, #e67e22);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(230, 126, 34, 0.4);
    }

    #importer-btn:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .file-input-label {
      display: block;
      padding: 12px 20px;
      background: linear-gradient(145deg, #3498db, #2980b9);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .file-input-label:hover {
      background: linear-gradient(145deg, #2980b9, #21618c);
      transform: translateY(-2px);
    }

    #import-file-name {
      font-size: 14px;
      color: #7f8c8d;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    #import-panel {
      align-items: center;
    }

    /* Conteneur pour positionner le bouton à gauche du plateau */
    .board-wrap {
      position: relative;
      display: none;
    }

    .plateau {
      display: grid;
      gap: 0;
      padding: 20px;
      background-color: #2c3e50;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    /* Liste des noms de joueurs, affichée sous le plateau */
    #players-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      margin-top: 16px;
      padding: 14px 18px;
      background: rgba(255,255,255,0.92);
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(0,0,0,.25);
      font-family: Arial, sans-serif;
      max-width: 100%;
    }

    #players-list:empty { display: none; padding: 0; margin-top: 0; box-shadow: none; }

    .player-name-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #2c3e50;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-name-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,.25);
      flex-shrink: 0;
    }

    .player-name-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-name-input-row .player-name-swatch {
      width: 18px;
      height: 18px;
    }

    .player-name-input-row input {
      flex: 1;
      padding: 6px 8px;
      font-size: 14px;
      border: 2px solid #e0e6ed;
      border-radius: 6px;
    }

    .player-name-input-row input:focus {
      border-color: #3498db;
      outline: none;
    }

    .case {
      width: 80px;
      height: 80px;
      border: 2px solid #34495e;
      display: flex;
      align-items: center;
      justify-content: center;
      font: bold 16px/1 Arial, sans-serif;
      color: black;
      box-sizing: border-box;
      transform: rotateY(0deg);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .case:hover {
      transform: scale(1.05);
      border-color: #2c3e50;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .flip { animation: tourner 2s ease-in-out; }
    @keyframes tourner {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); background:#34495e; color: transparent; }
      100% { transform: rotateY(360deg); }
    }

    /* Couleurs */
    .blanc { background:#ffffff; }
    .bleu { background:#3498db; color:white; }
    .rouge { background:#e74c3c; color:white; }
    .vert { background:#2ecc71; color:white; }
    .jaune { background:#f1c40f; }
    .orange { background:#e67e22; color:white; }
    .gris { background:#979595; color:white; }
    .violet { background:#9b59b6; color:white; }
    .rose { background:#ff69b4; color:white; }
    .noir { background:#000; color:white; }
    .marron { background:#795548; color:white; }
    .cyan { background:#00bcd4; color:black; }
    .turquoise { background:#16a085; color:white; }
    .indigo { background:#3f51b5; color:white; }
    .lime { background:#8bc34a; color:black; }
    .corail { background:#ff7f50; color:black; }
    .bordeaux { background:#6d1a36; color:white; }
    .olive { background:#6b8e23; color:white; }
    .saumon { background:#fa8072; color:black; }
    .azur { background:#4fc3f7; color:black; }

    /* Bouton "C'est parti !" à gauche du plateau */
    .action-btn {
      padding: 18px 28px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      transition: all .3s ease;
      z-index: 10;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }

#btn-parti {
  background: #3498db;      /* bleu */
  color: #fff;
  border: 4px solid #ffffff;
  border-radius: 14px;
  padding: 26px 42px;        /* plus gros */
  font-size: 28px;           /* plus gros */
  line-height: 1.1;          /* beau rendu sur 2 lignes */
  text-align: center;
  left: -220px;              /* à gauche, petite marge (~20px) */
}

    #btn-parti:hover { 
      background: #2980b9; 
      transform: translateY(-50%) scale(1.08);
      box-shadow: 0 6px 16px rgba(0,0,0,.4);
    }

    #board-controls {
      position: absolute;
      right: -280px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
      font-family: Arial, sans-serif;
      display: none;
      min-width: 160px;
      z-index: 1000;
    }

#generate-new-code {
  background: linear-gradient(145deg, #3498db, #2980b9);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  margin-top: 10px;
  transition: all 0.3s ease;
}

    #generate-new-code:hover {
      background: linear-gradient(145deg, #2980b9, #21618c);
      transform: translateY(-1px);
    }

    #modify-btn {
      background: #f39c12;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    #modify-btn:hover {
      background: #e67e22;
      transform: translateY(-1px);
    }
#generate-new-code, #modify-btn {
  padding: 10px 16px;
  font-size: 14px;
  height: 40px;
  flex: 1 1 0;
}
#generate-new-code { margin-top: 0; }
      
    #export-btn {
      background: #27ae60;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 10px;
    }

    #export-btn:hover {
      background: #229954;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
    }

    #board-controls h3 {
      margin: 0 0 10px 0;
      color: #2c3e50;
      font-size: 16px;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    /* Animation de disparition du bouton */
    .btn-disappear {
      opacity: 0;
      transform: translateY(-50%) scale(0.8) !important;
      transition: all 0.4s ease !important;
    }

    /* Surbrillance roulette */
    .highlight {
      box-shadow: 0 0 20px 8px #ffd700;
      transform: scale(1.25);
      z-index: 50;
      border-color: #ffd700 !important;
    }

    /* Case finale sélectionnée : surbrillance blanche à 70% */
    /* Case finale sélectionnée : blanc lumineux + halo, visible sur tout fond */
    /* Case finale sélectionnée : halo blanc marqué, remplissage discret pour rester lisible */
    .selected-final {
      cursor: default;
      border-color: #ffffff !important;
      border-width: 4px !important;
      position: relative;
      z-index: 900;
      box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px rgba(0, 0, 0, 0.35), 0 0 26px 10px rgba(255, 255, 255, 0.95), 0 0 46px 18px rgba(255, 255, 255, 0.55);
    }

    .selected-final::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    /* Fondu de couleur lors de la révélation du résultat d'un combat */
    .case-fondu {
      transition: background-color 2s ease, background 2s ease, color 2s ease !important;
    }

    .case-cible {
      cursor: pointer;
      border-color: #ff1fb0 !important;
      border-width: 4px !important;
      position: relative;
      z-index: 950;
      box-shadow: 0 0 0 3px #ff1fb0, 0 0 0 6px rgba(0, 0, 0, 0.35), 0 0 26px 10px rgba(255, 31, 176, 0.95), 0 0 46px 18px rgba(255, 31, 176, 0.55);
    }

    .case-cible:hover {
      box-shadow: 0 0 0 3px #ff1fb0, 0 0 0 6px rgba(0, 0, 0, 0.35), 0 0 32px 13px rgba(255, 31, 176, 1), 0 0 55px 22px rgba(255, 31, 176, 0.7);
    }

    .case-cible:hover::after {
      background: rgba(255, 31, 176, 0.55);
    }

    .case-cible::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 31, 176, 0.45);
      pointer-events: none;
    }

    /* Contrôles d'édition */
    #edit-controls {
      margin-top: 15px;
    }

    #edit-controls label {
      display: block;
      margin-bottom: 10px;
      color: #2c3e50;
      font-size: 14px;
    }

    #edit-controls select {
      margin-left: 10px;
      padding: 4px 8px;
      border: 1px solid #bdc3c7;
      border-radius: 4px;
      font-size: 12px;
    }

    #edit-controls button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    #apply-settings {
      background: #27ae60;
      color: white;
    }

    #cancel-edit {
      background: #95a5a6;
      color: white;
    }
    /* Fenêtre de résolution du combat (retour depuis la page Joueur) */
    #combat-overlay, #continuer-overlay, #victoire-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bloque tout clic pendant l'affichage du plateau après résolution du combat */
    #click-blocker {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: transparent;
      cursor: wait;
    }

    #combat-modal {
      background: white;
      border-radius: 20px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      max-width: 90vw;
      font-family: Arial, sans-serif;
    }

    #combat-modal h2 {
      margin: 0 0 20px 0;
      font-size: 42px;
      color: #2c3e50;
    }

    #victoire-modal {
      background: linear-gradient(160deg, #fffdf5, #fff3c4);
      border-radius: 24px;
      padding: 50px 60px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0,0,0,0.5), 0 0 0 6px #ffd700;
      max-width: 90vw;
      font-family: Arial, sans-serif;
    }

    #victoire-trophee {
      font-size: 70px;
      margin-bottom: 10px;
      animation: victoire-rebond 1s ease-in-out infinite alternate;
    }

    @keyframes victoire-rebond {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-10px) scale(1.08); }
    }

    #victoire-modal h2 {
      margin: 0 0 20px 0;
      font-size: 38px;
      color: #b8860b;
    }

    #victoire-ligne {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 26px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    #victoire-swatch {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 2px solid rgba(0,0,0,.25);
      flex-shrink: 0;
    }

    #combat-resume {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    #combat-resume .swatch-inline {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,.25);
      vertical-align: middle;
      margin: 0 4px;
    }

    #combat-boutons {
      display: flex;
      gap: 25px;
      justify-content: center;
    }

    .combat-btn {
      padding: 22px 40px;
      font-size: 28px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      color: white;
      transition: all 0.25s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }

    .combat-btn:hover {
      transform: translateY(-3px) scale(1.05);
    }

    .combat-btn-assaillant {
      background: linear-gradient(145deg, #e74c3c, #c0392b);
    }

    .combat-btn-defenseur {
      background: linear-gradient(145deg, #27ae60, #1e8449);
    }
  </style>
  </head>
  <body>
    <h1><u><span style="font-family: Cascadia Code; font-size: 50px">Plateau
          de jeu</span></u></h1>
    <div class="menu-buttons"> <button id="start-btn">Nouvelle partie</button>
      <button id="load-btn">Importer un plateau</button>
      <button id="resume-btn" style="display: none;">Reprendre le plateau en cours</button> </div>
    <!-- Choix joueurs / taille -->
    <div id="settings">
      <h3 id="settings-title">Configuration de la partie</h3>
      <label>Nombre de joueurs :
        <select id="nb-joueurs">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected="selected">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
          <option value="17">17</option>
          <option value="18">18</option>
          <option value="19">19</option>
          <option value="20">20</option>
        </select>
      </label> <label>Taille du plateau :
        <select id="taille-plateau">
          <option value="6">6x6</option>
          <option value="7">7x7</option>
          <option value="8" selected="selected">8x8</option>
          <option value="9">9x9</option>
          <option value="10">10x10</option>
          <option value="11">11x11</option>
          <option value="12">12x12</option>
          <option value="13">13x13</option>
          <option value="14">14x14</option>
          <option value="15">15x15</option>
        </select>
      </label>
      <div id="player-names-title" style="font-weight: 600; color: #34495e; text-align: center; margin-top: 5px;">Noms des joueurs (optionnel)</div>
      <div id="player-names-container" style="display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; padding-right: 6px;"></div>
      <div class="settings-buttons"> <button id="valider">Valider</button> <button

          id="annuler-settings">Annuler</button> </div>
    </div>
    <div id="import-panel">
      <h3 id="import-panel-title">Importer un plateau</h3>
      <label class="file-input-label" for="import-file-input">Choisir un fichier .txt</label>
      <input type="file" id="import-file-input" accept=".txt,.json,application/json,text/plain" style="display: none;">
      <div id="import-file-name">Aucun fichier choisi</div>
      <div> <button id="importer-btn" disabled>Importer</button> <button id="annuler">Annuler</button>
      </div>
    </div>
    <!-- Conteneur plateau + bouton gauche + mot de passe droite -->
    <div class="board-wrap" id="board-wrap"> <button id="btn-parti" class="action-btn"><span>C'est</span><br>
        <span>parti !</span></button>
      <div class="plateau" id="plateau"></div>
      <div id="players-list"></div>
      <div id="board-controls">
        <h3>Plateau</h3>
        <div style="display: flex; gap: 5px;"> <button id="generate-new-code"
            style="flex: 1;">Nouveau</button> <button id="modify-btn" style="flex: 1;">Modifier</button>
        </div>
        <button id="export-btn">Exporter (.txt)</button>
        <div id="edit-controls" style="display: none;"> <label> Nombre de
            joueurs :
            <select id="edit-nb-joueurs">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
            </select>
          </label> <label> Taille du plateau :
            <select id="edit-taille-plateau">
              <option value="6">6x6</option>
              <option value="7">7x7</option>
              <option value="8" selected="selected">8x8</option>
              <option value="9">9x9</option>
              <option value="10">10x10</option>
              <option value="11">11x11</option>

    <script>
    // Joueurs/couleurs disponibles (2 à 20)
    const joueursDisponibles = {
      blanc: 'J1', bleu: 'J2', rouge: 'J3', vert: 'J4', jaune: 'J5',
      orange: 'J6', gris: 'J7', violet: 'J8', rose: 'J9', noir: 'J10',
      marron: 'J11', cyan: 'J12', turquoise: 'J13', indigo: 'J14', lime: 'J15',
      corail: 'J16', bordeaux: 'J17', olive: 'J18', saumon: 'J19', azur: 'J20'
    };

    // Calcule la taille de case (et de police) à appliquer selon la taille du
    // plateau : inchangé (80px) jusqu'à 10x10, puis réduit progressivement
    // à partir de 11x11 pour que le plateau reste compact jusqu'à 15x15.
    function calculerTailleCase(t) {
      const size = t <= 10 ? 80 : Math.max(45, Math.round(80 - (t - 10) * 7));
      const font = Math.max(11, Math.round(16 * size / 80));
      return { size, font };
    }

    // Applique la taille de case calculée à un élément .case donné
    function appliquerTailleCase(case_, cellStyle) {
      case_.style.width = cellStyle.size + 'px';
      case_.style.height = cellStyle.size + 'px';
      case_.style.fontSize = cellStyle.font + 'px';
    }

    let couleurs = [];
    let joueurs = {};
    let taille = 8;
    let nbCases = taille * taille;
    let rouletteEnCours = false;
    let editMode = false;
    let plateauData = [];
    let currentSeed = null; // seed éphémère, utilisé uniquement au moment de générer un plateau aléatoire

    // Noms des joueurs, saisis avant la création du plateau. playerNames[i]
    // correspond à couleurs[i] (donc à "J" + (i+1) affiché sur les cases).
    let playerNames = [];

    // Construit dynamiquement les champs de saisie des noms dans le panneau
    // de configuration, en fonction du nombre de joueurs sélectionné. Les
    // noms déjà tapés sont conservés si on change le nombre de joueurs.
    function genererChampsNoms(n) {
      const container = document.getElementById('player-names-container');
      if (!container) return;

      // Conserver les valeurs déjà saisies avant de reconstruire
      const valeursActuelles = Array.from(container.querySelectorAll('input')).map(inp => inp.value);

      container.innerHTML = '';
      const couleursOrdre = Object.keys(joueursDisponibles);

      for (let i = 0; i < n; i++) {
        const couleur = couleursOrdre[i];
        const row = document.createElement('div');
        row.className = 'player-name-input-row';

        const swatch = document.createElement('div');
        swatch.className = 'player-name-swatch ' + couleur;

        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = `Nom du joueur ${joueursDisponibles[couleur]}`;
        input.maxLength = 24;
        input.dataset.index = i;
        input.value = valeursActuelles[i] || '';

        row.appendChild(swatch);
        row.appendChild(input);
        container.appendChild(row);
      }
    }

    // Lit les valeurs actuellement saisies dans les champs de noms
    function lireChampsNoms() {
      const container = document.getElementById('player-names-container');
      if (!container) return [];
      return Array.from(container.querySelectorAll('input')).map(inp => inp.value.trim());
    }

    // Affiche la liste "J1 : Nom" (ou juste "J1" si aucun nom saisi) sous le
    // plateau, avec une pastille de la couleur correspondante.
    function afficherNomsJoueurs() {
      const zone = document.getElementById('players-list');
      if (!zone) return;
      zone.innerHTML = '';

      couleurs.forEach((couleur, i) => {
        const label = joueursDisponibles[couleur] || `J${i + 1}`;
        const nom = (playerNames && playerNames[i]) ? playerNames[i].trim() : '';

        const entry = document.createElement('div');
        entry.className = 'player-name-entry';

        const swatch = document.createElement('div');
        swatch.className = 'player-name-swatch ' + couleur;

        const texte = document.createElement('span');
        texte.textContent = nom ? `${label} : ${nom}` : label;

        entry.appendChild(swatch);
        entry.appendChild(texte);
        zone.appendChild(entry);
      });
    }

    // ------------------------------------------------------------------
    // Sauvegarde locale du plateau (localStorage), pour pouvoir reprendre
    // exactement où on en était en revenant sur cette page — y compris si
    // la roulette ("C'est parti") a déjà désigné une case. Indépendante du
    // système d'export/import fichier ci-dessous.
    // ------------------------------------------------------------------

    const SAVE_KEY = 'plateauSauvegarde';
    let selectedFinalPosition = null; // position de la case désignée par la roulette (ou null)

    function savePlateauState() {
      try {
        const state = {
          nbJoueurs: couleurs.length,
          taille: taille,
          plateauData: plateauData.slice(),
          selectedPosition: selectedFinalPosition,
          playerNames: playerNames.slice(),
          timestamp: Date.now()
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('Sauvegarde du plateau impossible (localStorage indisponible) :', e);
      }
    }

    function chargerEtatSauvegarde() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const state = JSON.parse(raw);
        if (!state || !Array.isArray(state.plateauData) || state.plateauData.length === 0) return null;
        return state;
      } catch (e) {
        return null;
      }
    }

    function effacerSauvegarde() {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    }
      
      const rouletteAudio = new Audio('roulette.mp3');
rouletteAudio.preload = 'auto';

    // Générateur de nombres pseudo-aléatoires avec seed
    function seedRandom(seed) {
      let state = seed;
      return function() {
        state = (state * 1664525 + 1013904223) % 4294967296;
        return state / 4294967296;
      };
    }

    // ------------------------------------------------------------------
    // Export / Import du plateau sous forme de fichier .txt (JSON à
    // l'intérieur). Remplace l'ancien système de "code plateau" compact :
    // plus aucune limite sur le nombre de cases modifiables, et les noms
    // des joueurs sont conservés dans le fichier.
    // ------------------------------------------------------------------

    function exporterPlateau() {
      if (!plateauData || plateauData.length === 0) {
        alert('Aucun plateau à exporter !');
        return;
      }

      const data = {
        type: 'plateau-export',
        version: 1,
        nbJoueurs: couleurs.length,
        taille: taille,
        plateauData: plateauData.slice(),
        playerNames: playerNames.slice(),
        selectedPosition: selectedFinalPosition,
        exportedAt: new Date().toISOString()
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const horodatage = new Date().toISOString().replace(/[:.]/g, '-');
      const a = document.createElement('a');
      a.href = url;
      a.download = `plateau_${horodatage}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Valide la structure d'un objet importé avant de l'utiliser
    function validerDonneesPlateau(data) {
      if (!data || typeof data !== 'object') return 'Fichier invalide (format inattendu).';
      if (!Array.isArray(data.plateauData) || data.plateauData.length === 0) return 'Fichier invalide (plateau manquant).';
      const nbJoueurs = parseInt(data.nbJoueurs, 10);
      const tailleP = parseInt(data.taille, 10);
      if (!(nbJoueurs >= 2 && nbJoueurs <= 20)) return `Nombre de joueurs invalide dans le fichier : ${data.nbJoueurs}`;
      if (!(tailleP >= 6 && tailleP <= 15)) return `Taille de plateau invalide dans le fichier : ${data.taille}`;
      if (data.plateauData.length !== tailleP * tailleP) return 'Fichier invalide (le nombre de cases ne correspond pas à la taille indiquée).';
      const couleursValides = new Set(Object.keys(joueursDisponibles).slice(0, nbJoueurs));
      const toutesValides = data.plateauData.every(c => couleursValides.has(c));
      if (!toutesValides) return 'Fichier invalide (couleur inconnue détectée dans le plateau).';
      return null; // pas d'erreur
    }

    // Reconstruit le plateau directement depuis les données importées
    // (aucune régénération aléatoire : on affiche exactement ce que
    // contient le fichier, y compris les cases modifiées à la main et,
    // le cas échéant, la case déjà désignée par la roulette).
    function importerPlateauDepuisDonnees(data) {
      taille = parseInt(data.taille, 10);
      nbCases = taille * taille;
      couleurs = Object.keys(joueursDisponibles).slice(0, parseInt(data.nbJoueurs, 10));
      joueurs = {};
      couleurs.forEach(c => { joueurs[c] = joueursDisponibles[c]; });

      plateauData = data.plateauData.slice();
      playerNames = Array.isArray(data.playerNames) ? data.playerNames.slice() : [];
      selectedFinalPosition = (data.selectedPosition !== null && data.selectedPosition !== undefined)
        ? data.selectedPosition
        : null;

      afficherPlateauDirect();
      savePlateauState(); // pour que le retour depuis la page Joueur reprenne aussi le plateau importé

      console.log('Plateau importé depuis le fichier');
    }


    function cycleColor(case_) {
      const currentColor = case_.dataset.couleur;
      const nbJoueurs = parseInt(document.getElementById('edit-nb-joueurs').value);
      const availableColors = Object.keys(joueursDisponibles).slice(0, nbJoueurs);

      const currentIndex = availableColors.indexOf(currentColor);
      const nextIndex = (currentIndex + 1) % availableColors.length;
      const nextColor = availableColors[nextIndex];

      // Mettre à jour la case
      case_.className = `case ${nextColor}`;
      case_.dataset.couleur = nextColor;
      case_.textContent = joueursDisponibles[nextColor];

      // Mettre à jour les données du plateau
      const position = parseInt(case_.dataset.position);
      plateauData[position] = nextColor;

      // Plus besoin de suivre les modifications individuellement : la
      // sauvegarde locale et l'export stockent désormais l'état complet
      // du plateau tel quel, sans limite sur le nombre de cases modifiées.
      savePlateauState();

      // Fusionner les bordures après changement de couleur
      setTimeout(() => {
        fusionBordures();
      }, 50);
    }

    function updatePlateauFromEdit() {
      const nbJoueurs = parseInt(document.getElementById('edit-nb-joueurs').value);
      const newTaille = parseInt(document.getElementById('edit-taille-plateau').value);

      // Si la taille a changé, ajuster le plateau
      if (newTaille !== taille) {
        const oldTaille = taille;
        taille = newTaille;
        nbCases = taille * taille;

        const plateau = document.getElementById('plateau');

        // Sauvegarder l'état actuel du plateau
        const currentCases = Array.from(document.querySelectorAll('.case'));
        const savedData = currentCases.map(case_ => ({
          couleur: case_.dataset.couleur,
          position: parseInt(case_.dataset.position)
        }));

        plateau.innerHTML = "";
        plateauData = [];

        plateau.style.gridTemplateColumns = `repeat(${taille}, 1fr)`;
        plateau.style.gridTemplateRows = `repeat(${taille}, 1fr)`;

        const cellStyle = calculerTailleCase(taille);

        // Créer le nouveau plateau en préservant les données existantes
        for (let i = 0; i < taille * taille; i++) {
          const case_ = document.createElement('div');
          appliquerTailleCase(case_, cellStyle);

          // Calculer la position correspondante dans l'ancien plateau
          const row = Math.floor(i / taille);
          const col = i % taille;

          let couleur = 'blanc';
          let textContent = 'J1';

          // Si la position existe dans l'ancien plateau, récupérer ses données
          if (row < oldTaille && col < oldTaille) {
            const oldPosition = row * oldTaille + col;
            const oldCaseData = savedData.find(data => data.position === oldPosition);
            if (oldCaseData) {
              couleur = oldCaseData.couleur;
              textContent = joueursDisponibles[couleur] || 'J1';
            }
          }

          case_.className = `case ${couleur}`;
          case_.dataset.position = i;
          case_.dataset.couleur = couleur;
          case_.textContent = textContent;

          // Rendre la case cliquable pour changer de couleur
          case_.addEventListener('click', () => {
            if (editMode) {
              cycleColor(case_);
            }
          });

          plateau.appendChild(case_);
          plateauData.push(couleur);
        }

        // Fusionner les bordures après reconstruction
        setTimeout(() => {
          fusionBordures();
        }, 100);
      }

      // Mettre à jour les couleurs disponibles selon le nombre de joueurs
      const cases = document.querySelectorAll('.case');
      const availableColors = Object.keys(joueursDisponibles).slice(0, nbJoueurs);

      let colorsChanged = false;
      cases.forEach((case_, index) => {
        const currentColor = case_.dataset.couleur;
        if (!availableColors.includes(currentColor)) {
          // Si la couleur actuelle n'est plus disponible, passer en J1 (blanc)
          case_.className = 'case blanc';
          case_.dataset.couleur = 'blanc';
          case_.textContent = 'J1';
          plateauData[index] = 'blanc';
          colorsChanged = true;
        }
      });

      // Mettre à jour les variables globales
      couleurs = availableColors;
      joueurs = {};
      couleurs.forEach(c => { joueurs[c] = joueursDisponibles[c]; });

      // Ajuster le tableau des noms à la nouvelle liste de joueurs (les
      // noms déjà saisis pour les joueurs restants sont conservés)
      playerNames = couleurs.map((c, i) => playerNames[i] || '');
      afficherNomsJoueurs();

      // Sauvegarder l'état après changement de taille/couleurs
      savePlateauState();

      // Fusionner les bordures si des couleurs ont changé
      if (colorsChanged || newTaille !== parseInt(document.getElementById('edit-taille-plateau').dataset.previousValue || taille)) {
        setTimeout(() => {
          fusionBordures();
        }, 50);
      }

      // Stocker la taille actuelle pour détecter les changements futurs
      document.getElementById('edit-taille-plateau').dataset.previousValue = taille;
    }

    function genererDistribution(nbJoueurs, tailleP) {
      // Calculer le nombre de cases
      const totalCases = tailleP * tailleP;

      // Sélectionner les couleurs pour le nombre de joueurs
      const couleursActuelles = Object.keys(joueursDisponibles).slice(0, nbJoueurs);

      // Distribuer les cases entre les joueurs
      const distribution = [];
      const base = Math.floor(totalCases / couleursActuelles.length);
      let reste = totalCases % couleursActuelles.length;

      couleursActuelles.forEach(couleur => {
        const q = base + (reste > 0 ? 1 : 0);
        if (reste > 0) reste--;
        for (let i = 0; i < q; i++) distribution.push(couleur);
      });

      // Mélanger de manière déterministe si un seed est défini
      if (currentSeed !== null) {
        const rand = seedRandom(currentSeed);
        for (let i = distribution.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [distribution[i], distribution[j]] = [distribution[j], distribution[i]];
        }
      } else {
        for (let i = distribution.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [distribution[i], distribution[j]] = [distribution[j], distribution[i]];
        }
      }

      return {
        distribution: distribution,
        couleurs: couleursActuelles
      };
    }

    function fusionBordures() {
      const cases = document.querySelectorAll('.case');

      // Réinitialiser toutes les bordures d'abord
      cases.forEach(case_ => {
        case_.style.borderRight = "2px solid #34495e";
        case_.style.borderLeft = "2px solid #34495e";
        case_.style.borderTop = "2px solid #34495e";
        case_.style.borderBottom = "2px solid #34495e";
      });

      // Appliquer la fusion des bordures
      cases.forEach(case_ => {
        const pos = parseInt(case_.dataset.position, 10);
        const couleur = case_.dataset.couleur;

        // droite
        if ((pos + 1) % taille !== 0) {
          const v = document.querySelector(`.case[data-position="${pos+1}"]`);
          if (v && v.dataset.couleur === couleur) {
            case_.style.borderRight = "none";
            v.style.borderLeft = "none";
          }
        }
        // bas
        if (pos + taille < nbCases) {
          const v = document.querySelector(`.case[data-position="${pos+taille}"]`);
          if (v && v.dataset.couleur === couleur) {
            case_.style.borderBottom = "none";
            v.style.borderTop = "none";
          }
        }
      });
    }

    function enableEditMode() {
      editMode = true;
      const editControls = document.getElementById('edit-controls');
      const cases = document.querySelectorAll('.case');

      // Afficher les contrôles d'édition
      editControls.style.display = 'block';

      // Masquer le bouton "C'est parti !" s'il est visible
      document.getElementById('btn-parti').style.display = 'none';

      // Synchroniser les contrôles avec l'état actuel du plateau
      const currentPlayerCount = couleurs.length || 4;
      document.getElementById('edit-nb-joueurs').value = currentPlayerCount;
      document.getElementById('edit-taille-plateau').value = taille;

      // Supprimer tous les event listeners existants et en ajouter de nouveaux
      cases.forEach(case_ => {
        const newCase = case_.cloneNode(true);
        case_.parentNode.replaceChild(newCase, case_);

        newCase.style.cursor = 'pointer';
        newCase.addEventListener('click', () => {
          if (editMode) {
            cycleColor(newCase);
          }
        });
      });
    }

    function disableEditMode() {
      editMode = false;
      const editControls = document.getElementById('edit-controls');
      const cases = document.querySelectorAll('.case');
      const btnParti = document.getElementById('btn-parti');

      // Masquer les contrôles d'édition
      editControls.style.display = 'none';

      // Afficher le bouton "C'est parti !" si un plateau est présent
      if (cases.length > 0) {
        btnParti.style.display = 'block';
      }

      // Supprimer les event listeners de clic sur les cases
      cases.forEach(case_ => {
        case_.style.cursor = 'default';
        // Cloner l'élément pour supprimer tous les event listeners
        const newCase = case_.cloneNode(true);
        case_.parentNode.replaceChild(newCase, case_);
      });

      // Refaire la fusion des bordures après désactivation du mode édition
      setTimeout(() => fusionBordures(), 50);
    }

function genererPlateau(configData = null) {
  editMode = false;

  const wrap = document.getElementById('board-wrap');
  const plateau = document.getElementById('plateau');
  const boardControls = document.getElementById('board-controls');
  const editControls = document.getElementById('edit-controls');
  const btnParti = document.getElementById('btn-parti');

  // Cacher/réinitialiser le bouton et le panneau au démarrage
  if (btnParti) {
    btnParti.classList.remove('btn-disappear');
    btnParti.style.opacity = '';
    btnParti.style.transform = '';
    btnParti.style.display = 'none';
  }
  if (boardControls) boardControls.style.display = 'none';

  plateau.innerHTML = "";
  plateauData = [];

  plateau.style.gridTemplateColumns = `repeat(${taille}, 1fr)`;
  plateau.style.gridTemplateRows = `repeat(${taille}, 1fr)`;

  // Utiliser la configuration fournie ou en générer une nouvelle
  const config = configData || genererDistribution(couleurs.length || 4, taille);

  // Mettre à jour les variables globales
  couleurs = config.couleurs;
  joueurs = {};
  couleurs.forEach(c => { joueurs[c] = joueursDisponibles[c]; });

  // Construire le plateau (avec animation flip)
  const cellStyle = calculerTailleCase(taille);
  config.distribution.forEach((couleur, i) => {
    const case_ = document.createElement('div');
    case_.className = 'case flip';
    appliquerTailleCase(case_, cellStyle);
    case_.dataset.position = i;
    case_.dataset.couleur = couleur;
    plateauData.push(couleur);

    setTimeout(() => {
      case_.classList.remove('flip');
      case_.classList.add(couleur);
      case_.textContent = joueurs[couleur];

      // Fin du chargement des cases
      if (i === config.distribution.length - 1) {
        setTimeout(() => {
          fusionBordures();

          // Afficher EN MÊME TEMPS le panneau de contrôles et le bouton
          if (boardControls) boardControls.style.display = 'block';
          if (btnParti) {
            btnParti.classList.remove('btn-disappear');
            btnParti.style.opacity = '';
            btnParti.style.transform = '';
            btnParti.style.display = 'block';
          }

          // Un nouveau plateau efface le résultat de roulette précédent
          selectedFinalPosition = null;
          savePlateauState();

          afficherNomsJoueurs();

          if (editControls) editControls.style.display = 'none';
          editMode = false;

          console.log('Plateau affiché:', couleurs.length, 'joueurs,', taille + 'x' + taille);
        }, 120);
      }
    }, 2000);

    plateau.appendChild(case_);
  });

  // Afficher le conteneur plateau
  wrap.style.display = 'block';
}

    function lancerRoulette() {
      const cases = Array.from(document.querySelectorAll('.case'));
      if (cases.length === 0 || rouletteEnCours) return;
        try {
    rouletteAudio.currentTime = 0;
    rouletteAudio.play();
  } catch (e) {}

      rouletteEnCours = true;
      const btnParti = document.getElementById('btn-parti');

      // Faire disparaître le bouton avec animation
      btnParti.classList.add('btn-disappear');

      // Supprimer définitivement le bouton après l'animation
      setTimeout(() => {
        btnParti.style.display = 'none';
      }, 400);

      // Nettoyer l'état précédent
      cases.forEach(c => {
        c.classList.remove('highlight', 'selected-final');
        c.style.cursor = 'default';
        // Supprimer les anciens event listeners
        const newElement = c.cloneNode(true);
        c.parentNode.replaceChild(newElement, c);
      });

      // Mettre à jour la référence après le remplacement des éléments
      const newCases = Array.from(document.querySelectorAll('.case'));
      let derniereCaseChoisie = null;

      // Démarrer la roulette avec une vitesse variable
      let compteur = 0;
      const dureeTotal = 2000; // 2 secondes
      let intervalTime = 80; // Commencer plus lentement

      const interval = setInterval(() => {
        const rand = newCases[Math.floor(Math.random() * newCases.length)];

        // Retirer la surbrillance de toutes les cases
        newCases.forEach(c => c.classList.remove('highlight'));

        // Ajouter la surbrillance à la case aléatoire
        rand.classList.add('highlight');
        derniereCaseChoisie = rand;

        compteur += intervalTime;

        // Accélérer progressivement puis ralentir à la fin
        if (compteur < dureeTotal * 0.3) {
          intervalTime = Math.max(50, intervalTime - 2); // Accélération
        } else if (compteur > dureeTotal * 0.7) {
          intervalTime = Math.min(150, intervalTime + 5); // Ralentissement
        }

        // Arrêter la roulette après 2 secondes
        if (compteur >= dureeTotal) {
          clearInterval(interval);
          finaliserSelection(derniereCaseChoisie, newCases);
        }
      }, intervalTime);
    }

    // Calcule le groupe connecté (flood-fill, connectivité horizontale et
    // verticale) de même couleur que la case à `position`, position incluse.
    function calculerGroupeConnecte(position) {
      const couleur = plateauData[position];
      const visite = new Set([position]);
      const file = [position];
      while (file.length > 0) {
        const p = file.shift();
        const pr = Math.floor(p / taille), pc = p % taille;
        [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dr, dc]) => {
          const nr = pr + dr, nc = pc + dc;
          if (nr < 0 || nr >= taille || nc < 0 || nc >= taille) return;
          const np = nr * taille + nc;
          if (visite.has(np)) return;
          if (plateauData[np] !== couleur) return;
          visite.add(np);
          file.push(np);
        });
      }
      return Array.from(visite);
    }

    // Calcule les zones adjacentes attaquables : on considère TOUT le
    // territoire connecté de l'attaquant (pas seulement la case tirée au
    // sort), et on cherche toutes les cases d'une autre couleur qui
    // touchent ce territoire, où que ce soit sur son pourtour (haut, bas,
    // gauche, droite). Pour chaque case adverse trouvée, son groupe
    // connecté complet est ce qui sera capturé en cas de victoire. Retourne
    // un tableau de { entree, groupe }, un par groupe adverse distinct
    // touchant le territoire (l'affichage ne montre que la case d'entrée,
    // pour rester lisible, mais le groupe entier reste ce qui est en jeu).
    function calculerZonesAdjacentes(position) {
      const groupeAttaquant = calculerGroupeConnecte(position);
      const membresAttaquant = new Set(groupeAttaquant);
      const zones = [];
      const dejaTraitees = new Set();

      groupeAttaquant.forEach(pos => {
        const row = Math.floor(pos / taille);
        const col = pos % taille;

        [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dr, dc]) => {
          const r = row + dr, c = col + dc;
          if (r < 0 || r >= taille || c < 0 || c >= taille) return;

          const posVoisine = r * taille + c;

          // Fait partie du territoire de l'attaquant lui-même : pas une cible
          if (membresAttaquant.has(posVoisine)) return;
          // Déjà rattachée à un groupe adverse déjà trouvé (par un autre bord)
          if (dejaTraitees.has(posVoisine)) return;

          const groupe = calculerGroupeConnecte(posVoisine);
          groupe.forEach(p => dejaTraitees.add(p));
          zones.push({ entree: posVoisine, groupe });
        });
      });

      return zones;
    }

    // Zones actuellement en surbrillance (mémorisées pour retrouver, au clic
    // sur une case d'entrée, l'ensemble du groupe auquel elle appartient)
    let zonesAdjacentesActuelles = [];

    // Applique (et réinitialise) la surbrillance bleue sur la PREMIÈRE case
    // de chaque zone adjacente attaquable depuis la case désignée par la
    // roulette (pas toute la zone, pour rester lisible), et la rend
    // cliquable pour lancer le duel sur l'ensemble du groupe correspondant.
    function mettreEnSurbrillanceZonesAdjacentes(position) {
      document.querySelectorAll('.case-cible').forEach(c => c.classList.remove('case-cible'));
      zonesAdjacentesActuelles = [];
      if (position === null || position === undefined) return;

      const groupeAttaquant = calculerGroupeConnecte(position);
      const zones = calculerZonesAdjacentes(position);
      zonesAdjacentesActuelles = zones;

      zones.forEach(({ entree, groupe }) => {
        const case_ = document.querySelector(`.case[data-position="${entree}"]`);
        if (!case_) return;
        case_.classList.add('case-cible');
        case_.addEventListener('click', () => attaquerZone(groupeAttaquant, groupe), { once: true });
      });
    }

    // Lance le duel pour la zone ciblée choisie par le joueur : mémorise le
    // contexte du combat (zone de l'assaillant et zone visée) puis navigue
    // vers la page de tirage du thème.
    function attaquerZone(groupeAttaquant, groupeCible) {
      try {
        const contexte = {
          attaquantPositions: groupeAttaquant,
          attaquantCouleur: plateauData[groupeAttaquant[0]],
          ciblePositions: groupeCible,
          cibleCouleur: plateauData[groupeCible[0]],
          timestamp: Date.now()
        };
        localStorage.setItem('combatContexte', JSON.stringify(contexte));
      } catch (e) {
        console.warn('Impossible de mémoriser le contexte du combat :', e);
      }
      window.location.href = 'theme.html';
    }

    // ------------------------------------------------------------------
    // Résolution du combat au retour depuis la page Joueur : demande en
    // gros plan qui a gagné, puis applique le changement de zone (le
    // perdant du duel perd sa zone au profit du vainqueur).
    // ------------------------------------------------------------------

    function recupererContexteCombat() {
      try {
        const raw = localStorage.getItem('combatContexte');
        if (!raw) return null;
        const c = JSON.parse(raw);
        if (!c || !Array.isArray(c.attaquantPositions) || !Array.isArray(c.ciblePositions)) return null;
        return c;
      } catch (e) {
        return null;
      }
    }

    function effacerContexteCombat() {
      try { localStorage.removeItem('combatContexte'); } catch (e) {}
    }

    // Si un combat est en attente de résolution (le joueur est parti vers
    // theme.html/joueur.html sans avoir encore indiqué qui a gagné),
    // affiche la fenêtre de choix au premier plan.
    function verifierCombatEnAttente() {
      const contexte = recupererContexteCombat();
      if (!contexte) return;

      const overlay = document.getElementById('combat-overlay');
      const resume = document.getElementById('combat-resume');
      if (!overlay || !resume) return;

      const nbCible = contexte.ciblePositions.length;
      const nbAttaquant = contexte.attaquantPositions.length;
      resume.innerHTML =
        `L'Assaillant (<span class="swatch-inline ${contexte.attaquantCouleur}"></span>, ${nbAttaquant} case${nbAttaquant > 1 ? 's' : ''}) ` +
        `affrontait le Défenseur (<span class="swatch-inline ${contexte.cibleCouleur}"></span>, ${nbCible} case${nbCible > 1 ? 's' : ''}).<br>` +
        `Le vainqueur récupère la zone du perdant.`;

      overlay.style.display = 'flex';

      const btnAssaillant = document.getElementById('combat-btn-assaillant');
      const btnDefenseur = document.getElementById('combat-btn-defenseur');

      const gerer = (vainqueur) => {
        overlay.style.display = 'none';
        btnAssaillant.removeEventListener('click', surAssaillant);
        btnDefenseur.removeEventListener('click', surDefenseur);
        resoudreCombat(contexte, vainqueur);
      };
      const surAssaillant = () => gerer('assaillant');
      const surDefenseur = () => gerer('defenseur');

      btnAssaillant.addEventListener('click', surAssaillant);
      btnDefenseur.addEventListener('click', surDefenseur);
    }

    // Applique le résultat du combat : le perdant perd sa zone, qui devient
    // celle du vainqueur. Affiche ensuite le plateau mis à jour pendant 3
    // secondes (tout clic bloqué), puis demande si le vainqueur continue.
    // Vérifie si tout le plateau est désormais d'une seule et même couleur.
    // Retourne cette couleur si c'est le cas, sinon null.
    function verifierVictoire() {
      if (!plateauData || plateauData.length === 0) return null;
      const premiere = plateauData[0];
      const toutesIdentiques = plateauData.every(c => c === premiere);
      return toutesIdentiques ? premiere : null;
    }

    // Renvoie le libellé affichable d'un joueur ("J3 : Alice" ou juste "J3"
    // si aucun nom n'a été saisi pour cette couleur)
    function nomAffichableJoueur(couleur) {
      const idx = couleurs.indexOf(couleur);
      const label = joueursDisponibles[couleur] || couleur;
      const nom = (idx >= 0 && playerNames[idx]) ? playerNames[idx].trim() : '';
      return nom ? `${label} : ${nom}` : label;
    }

    // Affiche l'écran de fin de partie : le plateau est entièrement de la
    // couleur du vainqueur.
    function afficherVictoire(couleur) {
      effacerContexteCombat();
      effacerSauvegarde();

      const overlay = document.getElementById('victoire-overlay');
      const swatch = document.getElementById('victoire-swatch');
      const texte = document.getElementById('victoire-texte');
      if (!overlay) return;

      if (swatch) swatch.className = couleur;
      if (texte) texte.textContent = `${nomAffichableJoueur(couleur)} remporte la partie !`;

      overlay.style.display = 'flex';

      const btnNouvelle = document.getElementById('victoire-btn-nouvelle');
      if (btnNouvelle) {
        btnNouvelle.onclick = () => {
          overlay.style.display = 'none';
          const wrap = document.getElementById('board-wrap');
          if (wrap) wrap.style.display = 'none';
          const resumeBtn = document.getElementById('resume-btn');
          if (resumeBtn) resumeBtn.style.display = 'none';
          document.querySelector('.menu-buttons').style.display = 'flex';
        };
      }
    }

    function resoudreCombat(contexte, vainqueur) {
      let positionsChangees, ancienneCouleur, nouvelleCouleur;
      if (vainqueur === 'assaillant') {
        // L'Assaillant gagne : il récupère la zone du Défenseur
        positionsChangees = contexte.ciblePositions;
        ancienneCouleur = contexte.cibleCouleur;
        nouvelleCouleur = contexte.attaquantCouleur;
      } else {
        // Le Défenseur gagne : l'Assaillant perd sa zone
        positionsChangees = contexte.attaquantPositions;
        ancienneCouleur = contexte.attaquantCouleur;
        nouvelleCouleur = contexte.cibleCouleur;
      }

      effacerContexteCombat();

      // Nettoyer les surbrillances de l'ancien tour ; selectedFinalPosition
      // est volontairement conservée : après résolution, cette case porte
      // toujours la couleur du VAINQUEUR (inchangée s'il s'agit de
      // l'assaillant, recolorée s'il s'agit du défenseur), ce qui en fait
      // la référence naturelle pour une éventuelle poursuite de l'attaque.
      document.querySelectorAll('.case-cible').forEach(c => c.classList.remove('case-cible'));
      document.querySelectorAll('.selected-final').forEach(c => c.classList.remove('selected-final'));

      const blocker = document.getElementById('click-blocker');
      if (blocker) blocker.style.display = 'block';

      const DUREE_PAUSE_INITIALE = 1000;   // 1) affichage seul du plateau, avant tout changement
      const DUREE_FONDU = 2000;            // 2) transition de couleur des cases perdantes
      const DUREE_RESULTAT_FINAL = 1000;   // 3) affichage du résultat final, figé

      // Étape 1 : afficher uniquement le plateau tel qu'il est encore (avant
      // combat), sans aucun changement, pendant 1 seconde.
      afficherPlateauDirect({ geler: true });

      setTimeout(() => {
        // Étape 2 : lancer la transition de couleur sur les cases perdantes.
        positionsChangees.forEach(pos => {
          const case_ = document.querySelector(`.case[data-position="${pos}"]`);
          if (!case_) return;
          case_.classList.add('case-fondu');
          // Forcer le navigateur à "figer" l'état de départ (ancienne
          // couleur) avant de basculer vers la nouvelle : sans ce forçage
          // de reflow, les deux changements de classe sont regroupés en un
          // seul recalcul de style et la transition ne s'affiche jamais.
          void case_.offsetWidth;
          case_.classList.remove(ancienneCouleur);
          case_.classList.add(nouvelleCouleur);
          case_.dataset.couleur = nouvelleCouleur;
          case_.textContent = joueursDisponibles[nouvelleCouleur];
        });

        // Mettre à jour les données du plateau (déjà appliqué visuellement)
        positionsChangees.forEach(pos => {
          if (pos >= 0 && pos < plateauData.length) plateauData[pos] = nouvelleCouleur;
        });

        setTimeout(() => {
          // Étape 3 : le fondu (2s) est terminé. Reconstruire proprement le
          // plateau (bordures fusionnées, tailles, noms...) et laisser le
          // résultat final affiché, figé, pendant 1 seconde.
          afficherPlateauDirect({ geler: true });
          savePlateauState();

          setTimeout(() => {
            // Étape 4 : reprise du processus normal.
            if (blocker) blocker.style.display = 'none';

            // Le plateau est-il désormais entièrement d'une seule couleur ?
            // La partie s'arrête alors immédiatement.
            const couleurGagnante = verifierVictoire();
            if (couleurGagnante) {
              selectedFinalPosition = null;
              savePlateauState();
              afficherVictoire(couleurGagnante);
              return;
            }

            // Si la zone du vainqueur n'a plus aucun adversaire adjacent
            // (elle est devenue trop grande, ou entourée uniquement de son
            // propre territoire), impossible de continuer : le tour
            // s'arrête ici automatiquement, sans demander "veut-il continuer ?".
            const zonesDisponibles = calculerZonesAdjacentes(selectedFinalPosition);
            if (zonesDisponibles.length === 0) {
              alert('Plus aucun adversaire adjacent à cette zone : le tour se termine ici.');
              selectedFinalPosition = null;
              afficherPlateauDirect();
              savePlateauState();
              return;
            }

            demanderSiContinue();
          }, DUREE_RESULTAT_FINAL);
        }, DUREE_FONDU);
      }, DUREE_PAUSE_INITIALE);
    }

    // Demande si le vainqueur souhaite poursuivre l'attaque depuis sa
    // position actuelle, ou si le tour s'arrête là.
    function demanderSiContinue() {
      const overlay = document.getElementById('continuer-overlay');
      if (!overlay) return;
      overlay.style.display = 'flex';

      const btnOui = document.getElementById('continuer-btn-oui');
      const btnNon = document.getElementById('continuer-btn-non');

      const gerer = (continuer) => {
        overlay.style.display = 'none';
        btnOui.removeEventListener('click', surOui);
        btnNon.removeEventListener('click', surNon);

        if (continuer) {
          // Le vainqueur continue : la case de référence reste active, et
          // les nouvelles zones adjacentes (après capture) s'affichent.
          afficherPlateauDirect();
        } else {
          // Le vainqueur s'arrête : fin du tour, prêt pour un nouveau
          // tirage au sort via "C'est parti".
          selectedFinalPosition = null;
          afficherPlateauDirect();
        }
        savePlateauState();
      };
      const surOui = () => gerer(true);
      const surNon = () => gerer(false);

      btnOui.addEventListener('click', surOui);
      btnNon.addEventListener('click', surNon);
    }

    function finaliserSelection(caseFinale, allCases) {
      // Retirer la surbrillance temporaire de toutes les cases
      allCases.forEach(c => c.classList.remove('highlight'));

      // Appliquer le style final à la case sélectionnée
      if (caseFinale) {
        caseFinale.classList.add('selected-final');

        // Mémoriser la case désignée par la roulette et sauvegarder
        // immédiatement l'état complet du plateau, pour pouvoir le
        // retrouver tel quel si on revient sur cette page plus tard.
        selectedFinalPosition = parseInt(caseFinale.dataset.position);
        savePlateauState();

        // Mettre en surbrillance les zones adjacentes attaquables : c'est
        // désormais sur l'UNE DE CES ZONES qu'il faut cliquer pour lancer
        // le duel, plus sur la case désignée elle-même.
        mettreEnSurbrillanceZonesAdjacentes(selectedFinalPosition);

        setTimeout(() => {
          rouletteEnCours = false;
        }, 500);
      }
    }

    // Fonction pour générer un nouveau plateau aléatoire
    function generateNewRandomBoard() {
      const cases = document.querySelectorAll('.case');
      if (cases.length === 0) return;

      const nbJoueurs = couleurs.length || 4;

      // Générer un nouveau seed et un nouveau plateau déterministe
      currentSeed = Math.floor(Math.random() * 1000000000);
      const newConfig = genererDistribution(nbJoueurs, taille);

      // Régénérer le plateau avec la nouvelle configuration
      genererPlateau(newConfig);

      console.log('Nouveau plateau aléatoire généré');
    }

    // Reconstruit le plateau tel quel à partir d'un état sauvegardé
    // (sans régénération aléatoire), y compris le résultat de la roulette
    // s'il avait déjà été tiré.
    // Construit et affiche le plateau directement à partir de l'état global
    // courant (taille, couleurs, plateauData, playerNames,
    // selectedFinalPosition), sans animation. Utilisée à la fois par la
    // restauration locale (localStorage) et par l'import de fichier.
    function afficherPlateauDirect(options = {}) {
      const geler = options.geler === true;
      const plateau = document.getElementById('plateau');
      const wrap = document.getElementById('board-wrap');
      const boardControls = document.getElementById('board-controls');
      const editControls = document.getElementById('edit-controls');
      const btnParti = document.getElementById('btn-parti');

      if (wrap) wrap.style.display = 'block';

      plateau.innerHTML = '';
      plateau.style.gridTemplateColumns = `repeat(${taille}, 1fr)`;
      plateau.style.gridTemplateRows = `repeat(${taille}, 1fr)`;

      const cellStyle = calculerTailleCase(taille);
      plateauData.forEach((couleur, i) => {
        const case_ = document.createElement('div');
        case_.className = `case ${couleur}`;
        appliquerTailleCase(case_, cellStyle);
        case_.dataset.position = i;
        case_.dataset.couleur = couleur;
        case_.textContent = joueursDisponibles[couleur];
        plateau.appendChild(case_);
      });

      if (boardControls) boardControls.style.display = 'block';
      if (editControls) editControls.style.display = 'none';
      editMode = false;

      if (geler) {
        // Affichage neutre pendant le blocage de 3 secondes après un combat :
        // pas de surbrillance, pas de bouton "C'est parti", rien de cliquable.
        if (btnParti) btnParti.style.display = 'none';
      } else if (selectedFinalPosition !== null) {
        // La roulette avait déjà désigné une case : on l'affiche directement,
        // prête à être cliquée pour continuer vers la page suivante.
        if (btnParti) btnParti.style.display = 'none';
        const caseFinale = plateau.querySelector(`[data-position="${selectedFinalPosition}"]`);
        if (caseFinale) {
          caseFinale.classList.add('selected-final');
          mettreEnSurbrillanceZonesAdjacentes(selectedFinalPosition);
        }
      } else {
        // Pas encore de résultat de roulette : on repropose "C'est parti",
        // et les cases restent modifiables via le bouton "Modifier".
        if (btnParti) {
          btnParti.classList.remove('btn-disappear');
          btnParti.style.opacity = '';
          btnParti.style.transform = '';
          btnParti.style.display = 'block';
        }
        plateau.querySelectorAll('.case').forEach(case_ => {
          case_.addEventListener('click', () => {
            if (editMode) cycleColor(case_);
          });
        });
      }

      afficherNomsJoueurs();
      setTimeout(() => fusionBordures(), 100);
    }

    function restaurerPlateauDepuisSauvegarde(saved) {
      taille = saved.taille;
      nbCases = taille * taille;
      couleurs = Object.keys(joueursDisponibles).slice(0, saved.nbJoueurs);
      joueurs = {};
      couleurs.forEach(c => { joueurs[c] = joueursDisponibles[c]; });

      plateauData = saved.plateauData.slice();
      playerNames = Array.isArray(saved.playerNames) ? saved.playerNames.slice() : [];
      selectedFinalPosition = (saved.selectedPosition !== null && saved.selectedPosition !== undefined)
        ? saved.selectedPosition
        : null;

      afficherPlateauDirect();

      console.log('Plateau restauré depuis la sauvegarde locale');

      // Vérifier si un combat est en attente de résolution (retour depuis
      // la page Joueur après un duel) et proposer de le trancher.
      verifierCombatEnAttente();
    }

    // --- Interactions ---

    // Si un plateau a été sauvegardé précédemment (avant une navigation vers
    // theme.html par exemple), proposer de le reprendre tel quel.
    (function initReprise() {
      const saved = chargerEtatSauvegarde();
      const resumeBtn = document.getElementById('resume-btn');
      const urlParams = new URLSearchParams(window.location.search);
      const autoResume = urlParams.get('resume') === '1';

      if (saved && resumeBtn) {
        const dateStr = new Date(saved.timestamp).toLocaleString('fr-FR');
        resumeBtn.textContent = `Reprendre le plateau en cours (${dateStr})`;
        resumeBtn.style.display = 'inline-block';
        resumeBtn.addEventListener('click', () => {
          document.querySelector('.menu-buttons').style.display = 'none';
          restaurerPlateauDepuisSauvegarde(saved);
        });
      }

      // Retour direct depuis le bouton "Retour au plateau" de la page
      // Joueur (Plateau.html?resume=1) : on reprend automatiquement le
      // plateau sauvegardé, sans clic supplémentaire.
      if (saved && autoResume) {
        document.querySelector('.menu-buttons').style.display = 'none';
        restaurerPlateauDepuisSauvegarde(saved);
      }
    })();

    document.getElementById('start-btn').addEventListener('click', () => {
      document.querySelector('.menu-buttons').style.display = 'none';
      document.getElementById('settings').style.display = 'flex';
      genererChampsNoms(parseInt(document.getElementById('nb-joueurs').value, 10));
    });

    document.getElementById('nb-joueurs').addEventListener('change', (e) => {
      genererChampsNoms(parseInt(e.target.value, 10));
    });

    document.getElementById('load-btn').addEventListener('click', () => {
      document.querySelector('.menu-buttons').style.display = 'none';
      document.getElementById('import-panel').style.display = 'flex';
    });

    document.getElementById('valider').addEventListener('click', () => {
      const nbJoueurs = parseInt(document.getElementById('nb-joueurs').value, 10);
      taille = parseInt(document.getElementById('taille-plateau').value, 10);
      nbCases = taille * taille;

      // Récupérer les noms saisis (avant la création du plateau)
      playerNames = lireChampsNoms();

      document.getElementById('settings').style.display = 'none';

      // Générer le plateau avec les paramètres choisis
      // Créer un nouveau seed pour cette partie
      currentSeed = Math.floor(Math.random() * 1000000000);
      const config = genererDistribution(nbJoueurs, taille);
      genererPlateau(config);
    });

    // Import d'un plateau depuis un fichier .txt (JSON à l'intérieur)
    let fichierImportSelectionne = null;

    document.getElementById('import-file-input').addEventListener('change', (e) => {
      const fichier = e.target.files[0] || null;
      fichierImportSelectionne = fichier;
      const nomZone = document.getElementById('import-file-name');
      const importerBtn = document.getElementById('importer-btn');
      if (fichier) {
        nomZone.textContent = fichier.name;
        importerBtn.disabled = false;
      } else {
        nomZone.textContent = 'Aucun fichier choisi';
        importerBtn.disabled = true;
      }
    });

    document.getElementById('importer-btn').addEventListener('click', () => {
      if (!fichierImportSelectionne) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        let data;
        try {
          data = JSON.parse(e.target.result);
        } catch (err) {
          alert('Fichier invalide : ce n\'est pas un fichier de sauvegarde de plateau valide (JSON illisible).');
          return;
        }

        const erreur = validerDonneesPlateau(data);
        if (erreur) {
          alert('Fichier invalide : ' + erreur);
          return;
        }

        importerPlateauDepuisDonnees(data);

        document.getElementById('import-panel').style.display = 'none';
        document.getElementById('import-file-input').value = '';
        document.getElementById('import-file-name').textContent = 'Aucun fichier choisi';
        document.getElementById('importer-btn').disabled = true;
        fichierImportSelectionne = null;
      };
      reader.onerror = () => {
        alert('Erreur lors de la lecture du fichier.');
      };
      reader.readAsText(fichierImportSelectionne);
    });

    document.getElementById('annuler-settings').addEventListener('click', () => {
      document.getElementById('settings').style.display = 'none';
      document.querySelector('.menu-buttons').style.display = 'flex';
      // Réinitialiser les valeurs par défaut
      document.getElementById('nb-joueurs').value = '4';
      document.getElementById('taille-plateau').value = '8';
      genererChampsNoms(4);
    });

    document.getElementById('annuler').addEventListener('click', () => {
      document.getElementById('import-panel').style.display = 'none';
      document.querySelector('.menu-buttons').style.display = 'flex';
      document.getElementById('import-file-input').value = '';
      document.getElementById('import-file-name').textContent = 'Aucun fichier choisi';
      document.getElementById('importer-btn').disabled = true;
      fichierImportSelectionne = null;
    });

    // Event listener pour le bouton "C'est parti !"
    document.getElementById('btn-parti').addEventListener('click', lancerRoulette);

    // Event listeners pour les contrôles
    document.getElementById('apply-settings').addEventListener('click', updatePlateauFromEdit);

    // Bouton "Nouveau" génère un plateau complètement nouveau
document.getElementById('generate-new-code').addEventListener('click', () => {
  if (!confirm('Générer un nouveau plateau ? Le plateau actuel sera remplacé.')) return;
  generateNewRandomBoard();
});

    // Bouton "Exporter" télécharge un fichier .txt avec l'état complet du plateau
    document.getElementById('export-btn').addEventListener('click', exporterPlateau);

    document.getElementById('modify-btn').addEventListener('click', enableEditMode);

    document.getElementById('cancel-edit').addEventListener('click', disableEditMode);
    </script>
  </body>
</html>
