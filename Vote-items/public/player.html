<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote_items — Vote</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>🗳️ Vote_items</h1>
      <div class="subtitle" id="player-subtitle">Chargement…</div>
    </div>
  </header>

  <div id="error-card" class="card" style="display:none">
    <p id="error-msg" class="status-msg error"></p>
  </div>

  <div id="locked-banner" class="locked-banner" style="display:none">
    ✅ Vos votes sont validés. Contactez l'organisateur si vous devez les modifier.
  </div>

  <div id="content" style="display:none">
    <div class="card">
      <strong><span id="answered-count">0</span>/<span id="total-count">0</span></strong> items votés
      <div class="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
      <div class="status-msg" id="save-msg"></div>
    </div>

    <div id="items-list"></div>

    <div class="row-actions">
      <button class="btn-secondary" id="btn-save">💾 Sauvegarder</button>
      <button class="btn-primary" id="btn-validate">✅ Valider (fin de session)</button>
    </div>
    <p class="hint" id="validate-hint"></p>
  </div>
</div>

<script src="/static/player.js"></script>
</body>
</html>
