<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qui est-ce ? — Joueur {{ player }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ v }}">
</head>
<body data-player="{{ player }}">
<div class="board-page">
  <div class="top-bar">
    <span class="player-badge p{{ player }}" id="player-badge">JOUEUR {{ player }}</span>
    <span class="turn-status" id="turn-status">Chargement…</span>
  </div>

  <div class="game-area">
    <div class="mystery-panel">
      <h3>MON PERSONNAGE À FAIRE DEVINER</h3>
      <div class="mystery-frame" id="mystery-frame">
        <div class="mystery-placeholder">En attente du choix…</div>
      </div>
      <div class="mystery-name" id="mystery-name">—</div>
      <button class="btn-brass" id="choix-btn" style="width:100%; margin-top:1rem;">Choix</button>

      <div class="mystery-actions" id="mystery-actions">
        <button class="btn-red" id="eliminate-btn" disabled>Éliminer</button>
        <button class="btn-blue" id="propose-toggle-btn" style="display:none;" disabled>Proposer un suspect</button>
        <button class="btn-navy" id="end-turn-btn" disabled>Fin du tour</button>
      </div>
      <p class="guess-hint" id="guess-hint" style="display:none;">Clique sur un suspect encore actif du plateau pour le proposer.</p>
    </div>

    <div class="board-wrap">
      <div class="board-grid" id="board-grid"></div>
      <div class="locked-overlay" id="locked-overlay" style="display:none;">
        <span class="display">Plateau verrouillé</span>
        <span>Ce n'est pas ton tour.</span>
      </div>
    </div>
  </div>
</div>

<div class="countdown-overlay" id="countdown-overlay" style="display:none;">
  <div class="countdown-number" id="countdown-number">3</div>
  <div class="countdown-label" id="countdown-label">LA PARTIE COMMENCE…</div>
</div>

<div class="confirm-overlay" id="confirm-overlay" style="display:none;">
  <div class="confirm-box">
    <p id="confirm-message">—</p>
    <div class="confirm-actions">
      <button class="btn-ghost-dark" id="confirm-no">Annuler</button>
      <button class="btn-brass" id="confirm-yes">Confirmer</button>
    </div>
  </div>
</div>

<div class="winner-banner" id="winner-banner" style="display:none;">
  <span class="eyebrow">Affaire classée</span>
  <h2 id="winner-text">—</h2>
  <button class="btn-brass" onclick="location.href='/'">Nouvelle enquête</button>
</div>

<div class="toast" id="toast"></div>

<script>window.PLAYER = {{ player }};</script>
<script src="{{ url_for('static', filename='js/board.js') }}?v={{ v }}"></script>
</body>
</html>
